
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI QR Generator</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        input:focus, select:focus {
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* QR Popup */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(0,0,0,0.65);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            max-width: 340px;
            position: relative;
        }

        .modal-content img {
            width: 240px;
            height: 240px;
            max-width: 100%;
        }

        .close-btn {
            position: absolute;
            top: 8px;
            right: 12px;
            width: auto;
            background: transparent;
            color: #333;
            font-size: 26px;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .modal-content p {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h2>UPI QR Generator</h2>

        <div class="input-group">
            <label for="upiId">Select UPI ID</label>
            <select id="upiId">
                <option value="">-- Select UPI ID --</option>
                <option value="Q114562589@ybl">SBI</option>
                <option value="Q005621399@ybl">PNB</option>
            </select>
        </div>

        <div class="input-group">
            <label for="payeeName">Payee Name (Optional)</label>
            <input
                type="text"
                id="payeeName"
                placeholder="Enter payee name"
            >
        </div>

        <div class="input-group">
            <label for="amount">Amount (₹) (Optional)</label>
            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
                min="1"
                step="0.01"
            >
        </div>

        <button onclick="generateQR()">Generate QR Code</button>

    </div>

    <!-- QR Popup -->
    <div class="modal" id="qrModal">
        <div class="modal-content">

            <button class="close-btn" onclick="closeQR()">&times;</button>

            <h3>Scan to Pay</h3>

            <img id="qrImage" src="" alt="UPI QR Code">

            <p>Scan using any UPI payment application</p>

        </div>
    </div>

    <script>

        function generateQR() {

            const upiId = document.getElementById('upiId').value;
            const payeeName = document.getElementById('payeeName').value.trim();
            const amount = document.getElementById('amount').value.trim();

            // Only UPI ID is mandatory
            if (!upiId) {
                alert('Please select a UPI ID');
                return;
            }

            if (amount && (!Number.isFinite(Number(amount)) || Number(amount) <= 0)) {
                alert('Please enter a valid amount');
                return;
            }

            // Create UPI payment parameters
            const params = new URLSearchParams();

            params.set('pa', upiId);
            params.set('cu', 'INR');

            // Add optional payee name
            if (payeeName) {
                params.set('pn', payeeName);
            }

            // Add optional amount
            if (amount) {
                params.set('am', Number(amount).toFixed(2));
            }

            const upiUrl = `upi://pay?${params.toString()}`;

            // Generate QR
            const qrApiUrl =
                `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(upiUrl)}`;

            document.getElementById('qrImage').src = qrApiUrl;

            // Open popup
            document.getElementById('qrModal').style.display = 'flex';
        }

        function closeQR() {
            document.getElementById('qrModal').style.display = 'none';
        }

        document.getElementById('qrModal').addEventListener('click', function(event) {
            if (event.target === this) {
                closeQR();
            }
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeQR();
            }
        });

    </script>

</body>
</html>
