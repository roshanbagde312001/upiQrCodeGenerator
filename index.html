
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Payment Generator</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        input:focus, select:focus {
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .qr-container {
            margin-top: 20px;
            display: none;
        }

        .qr-container img {
            width: 200px;
            height: 200px;
            border: 1px solid #ddd;
            padding: 8px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h2>UPI QR Generator</h2>

        <!-- UPI ID Dropdown -->
        <div class="input-group">
            <label for="upiId">Select UPI ID</label>

            <select id="upiId">
                <option value="">-- Select UPI ID --</option>
                <option value="Q114562589@ybl">Q114562589@ybl</option>
                <option value="lxwere.axl">lxwere.axl</option>
            </select>
        </div>

        <!-- Payee Name -->
        <div class="input-group">
            <label for="payeeName">Payee Name</label>
            <input
                type="text"
                id="payeeName"
                placeholder="e.g. Shop Name / Your Name"
            >
        </div>

        <!-- Amount -->
        <div class="input-group">
            <label for="amount">Amount (₹)</label>
            <input
                type="number"
                id="amount"
                placeholder="e.g. 150"
                min="1"
                step="0.01"
            >
        </div>

        <!-- Generate Button -->
        <button onclick="generateQR()">
            Generate QR Code
        </button>

        <!-- QR Code -->
        <div class="qr-container" id="qrContainer">
            <p><strong>Scan with any UPI App</strong></p>
            <img id="qrImage" src="" alt="UPI QR Code">
        </div>

    </div>

    <script>
        function generateQR() {

            const upiId = document.getElementById('upiId').value;
            const payeeName = document.getElementById('payeeName').value.trim();
            const amount = document.getElementById('amount').value.trim();

            // Validate fields
            if (!upiId || !payeeName || !amount) {
                alert('Please fill in all fields');
                return;
            }

            // Validate amount
            if (!Number.isFinite(Number(amount)) || Number(amount) <= 0) {
                alert('Please enter a valid amount');
                return;
            }

            // Generate UPI Payment URL
            const upiUrl =
                `upi://pay?pa=${encodeURIComponent(upiId)}` +
                `&pn=${encodeURIComponent(payeeName)}` +
                `&am=${encodeURIComponent(amount)}` +
                `&cu=INR`;

            // Generate QR Code
            const qrApiUrl =
                `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(upiUrl)}`;

            // Display QR Code
            document.getElementById('qrImage').src = qrApiUrl;
            document.getElementById('qrContainer').style.display = 'block';
        }
    </script>

</body>
</html>
